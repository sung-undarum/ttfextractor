name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest 러너에는 Android SDK 가 이미 설치되어 있고 ANDROID_HOME 이 설정돼 있음
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FontExtractor-build${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FontExtractor-debug
          path: FontExtractor-build*.apk

      # 로그인 없이 받을 수 있도록 Release 에도 첨부 (main 브랜치 푸시 때만)
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: "Debug APK built from ${{ github.sha }}"
          files: FontExtractor-build*.apk
          make_latest: true
